<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8"><title>Pokerkvällen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="theme-color" content="#14201b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Poker">
<style>
:root{--bg:#0c1013;--fg:#eef2f5;--card:#171d22;--card2:#1f272e;--bd:#2b353d;--mut:#8b98a5;--ac:#e0372e;--gold:#f2c14e;--green:#2fa862;--amber:#e3a21a;--felt:#1d5f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:radial-gradient(120% 60% at 50% 0%,#1a252d 0%,#0c1013 62%) fixed;color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:12px;max-width:520px;min-height:100vh}
h1{font-size:18px;margin:2px 0 10px;font-weight:800;letter-spacing:.01em}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--fg);min-width:0}
button{cursor:pointer;font-weight:700;background:linear-gradient(#2a343d,#212a31);border-color:#38444e;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
button.p{background:linear-gradient(#e8473d,#b9291f);border-color:#b9291f;color:#fff}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1}label{display:flex;flex-direction:column;gap:2px}
summary{cursor:pointer}
.msg{background:#151b20;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px}.mut{color:var(--mut);font-size:14px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:6px 0}
.pl.t{border-color:var(--ac)}.pl.f{opacity:.5}.pl small{color:var(--mut)}.hs{display:flex;gap:4px}
.felt{background:radial-gradient(ellipse at 50% 35%,#2b8068,#133f33);border:6px solid #241d19;border-radius:26px;padding:12px;text-align:center;color:#fff}.felt .pot{font-size:14px;opacity:.9;margin-bottom:6px;color:var(--gold);font-weight:800}
.board{display:flex;gap:4px;justify-content:center;min-height:44px}.felt .cd{--cs:12px}

/* ---- kort ---- */
.cd{position:relative;display:inline-block;flex:none;width:2.55em;height:3.5em;font-size:var(--cs,16px);line-height:1;font-weight:800;vertical-align:top;overflow:hidden;border-radius:.34em;color:#16181a;background:linear-gradient(160deg,#fff 0%,#eeeeea 100%);box-shadow:0 .1em .3em rgba(0,0,0,.6),inset 0 0 0 .06em rgba(0,0,0,.2)}
.cd b{position:absolute;left:.2em;top:.13em;font-size:1.14em;letter-spacing:-.07em}
.cd i{position:absolute;left:.28em;top:1.32em;font-style:normal;font-size:.9em}
.cd u{position:absolute;right:.08em;bottom:.04em;text-decoration:none;font-size:1.95em;opacity:.92}
.s1,.s2{color:#d6232a}
body[data-deck=four] .s2{color:#1b66d6}body[data-deck=four] .s3{color:#1b8a3a}
body[data-deck=solid] .cd{color:#fff;box-shadow:0 .1em .3em rgba(0,0,0,.6),inset 0 0 0 .06em rgba(0,0,0,.35)}body[data-deck=solid] .s0{background:linear-gradient(160deg,#33383d,#1c1f22)}body[data-deck=solid] .s1{background:linear-gradient(160deg,#e23a41,#a9161d)}body[data-deck=solid] .s2{background:linear-gradient(160deg,#2f7be8,#1450a8)}body[data-deck=solid] .s3{background:linear-gradient(160deg,#2aa14d,#146b30)}
body[data-deck=dark] .cd{background:linear-gradient(160deg,#2a2f34,#16191c);color:#eee}body[data-deck=dark] .s1,body[data-deck=dark] .s2{color:#ff7468}
body{--b1:#2a4f8f;--b2:#1e3a6b}body[data-back=red]{--b1:#a02a2a;--b2:#6e1b1b}body[data-back=green]{--b1:#2a7a4a;--b2:#1b5233}body[data-back=gold]{--b1:#b8912f;--b2:#8a6a1c}
body .cd.back{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.25) 0 .35em,transparent .36em),repeating-linear-gradient(45deg,var(--b1) 0 .28em,var(--b2) .28em .56em);box-shadow:0 .1em .3em rgba(0,0,0,.6),inset 0 0 0 .16em #f4f1ea,inset 0 0 0 .22em var(--b2)}
.cd.new{animation:deal .4s cubic-bezier(.2,.8,.25,1) both}
@keyframes deal{from{transform:translateY(-28px) scale(.6) rotate(-9deg);opacity:0}to{transform:none;opacity:1}}

/* ---- bord ---- */
.tbl{position:relative;margin:6px 0 10px}
.oval{position:absolute;border-radius:999px;background:radial-gradient(ellipse at 50% 36%,#2b8068 0%,#1d5f4d 48%,#133f33 100%);border:9px solid #241d19;box-shadow:inset 0 0 0 2px #8a6a2f,inset 0 0 36px 6px rgba(0,0,0,.55),0 10px 26px rgba(0,0,0,.65),0 0 0 2px #0a0807}
.oval::before{content:"";position:absolute;inset:9% 8%;border:2px solid rgba(255,255,255,.09);border-radius:999px}
.oval::after{content:"Pokerkvällen";position:absolute;left:0;right:0;top:66%;text-align:center;font-weight:800;letter-spacing:.12em;font-size:12px;color:rgba(255,255,255,.07)}
.mid{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;z-index:2}
.mid .board{flex-wrap:wrap;gap:3px;min-height:0;margin-top:2px}.mid small{font-size:10px;opacity:.8}
.potpill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);border:1px solid rgba(242,193,78,.4);color:var(--gold);padding:3px 12px 3px 8px;border-radius:999px;font-weight:800;font-size:13px;margin-bottom:4px}
.chip{display:inline-block;width:15px;height:15px;border-radius:50%;background:#d6382f;box-shadow:inset 0 0 0 2.5px #f2eee2,inset 0 0 0 4px rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.45);flex:none}
.bet{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);padding:2px 8px 2px 4px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}
.st{position:absolute;transform:translate(-50%,-50%);z-index:4;text-align:center;line-height:1.2;font-size:12px;height:58px}
.st .av{position:absolute;left:50%;top:0;margin-left:-16px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:2}
.st .plate{position:absolute;left:0;right:0;top:24px;padding:9px 3px 3px;border-radius:9px;background:linear-gradient(#27313a,#171d22);border:1px solid #3b4752;box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:1}
.st .nm{font-weight:700;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e9eef2}
.st .stk{font-weight:800;font-size:12px;color:var(--gold)}.st .stt{font-weight:800;font-size:11px;color:#ff8a7e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .hs{position:absolute;right:calc(50% - 31px);top:3px;gap:0;flex-wrap:nowrap;z-index:3}.st .hs .cd{--cs:5.9px}.st .hs .cd+.cd{margin-left:-.95em}.st .hs .cd:nth-child(1){transform:rotate(-7deg)}.st .hs .cd:nth-child(2){transform:rotate(7deg)}
.st .cn{position:absolute;right:-6px;bottom:-6px;background:#000;color:#fff;border-radius:999px;font-size:9px;padding:0 4px;line-height:14px;border:1px solid #3b4752}
.st .dlr{position:absolute;left:4px;top:-3px;z-index:6;width:17px;height:17px;border-radius:50%;background:#fff;color:#111;font-size:11px;line-height:17px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.7)}
.st.f{opacity:.55}.st.f .hs{display:none}.st.off .av{filter:grayscale(1)}
.st.t .av{border-color:#fff;box-shadow:0 0 0 3px var(--ac),0 0 16px 4px rgba(224,55,46,.65);animation:pulse 1.2s ease-in-out infinite}.st.t .plate{border-color:var(--ac)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--ac),0 0 10px 2px rgba(224,55,46,.45)}50%{box-shadow:0 0 0 3px var(--ac),0 0 20px 7px rgba(224,55,46,.8)}}
@property --p{syntax:'<number>';inherits:false;initial-value:100}
@keyframes tbk{from{--p:var(--f0)}to{--p:0}}
.tb{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.14) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:tbk linear forwards;pointer-events:none}
.st.win .av{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 18px 5px rgba(242,193,78,.75)}.st.win .plate{border-color:var(--gold);box-shadow:0 0 12px rgba(242,193,78,.65)}
.mine{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:5}.mine .cd{--cs:17px}.pk{display:inline-block;cursor:pointer;transition:transform .15s}
.pl .cd{--cs:9.5px}.mid .cd{--cs:14px}

/* ---- knappar ---- */
.mini{padding:4px 10px;font-size:13px;margin-left:6px}.tbk{padding:8px;font-size:14px;width:100%}
.st.stud{height:84px}.upr{position:absolute;left:0;right:0;top:62px;display:flex;justify-content:center;z-index:2}.upr .cd{--cs:6.4px}.upr .cd+.cd{margin-left:-.72em}.mine.sm .cd{--cs:13.5px}.cd.dn::before{content:"";position:absolute;right:.22em;top:.2em;width:.5em;height:.5em;border-radius:50%;background:var(--ac)}
.lg{max-height:260px;overflow:auto;font-size:13px}
.act{margin:8px 0;padding:10px;border:1px solid #33404a;border-radius:16px;background:linear-gradient(#1a2127,#12171b);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.act button{padding:14px 8px;font-size:17px;border-radius:12px;font-weight:800;border:0;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.act .qk button{padding:7px 4px;font-size:13px;border-radius:999px;background:#232c34;border:1px solid #3a4650;font-weight:700;box-shadow:none;color:var(--fg)}
.act .tbk{background:transparent;border:1px solid #3a4650;box-shadow:none;font-size:14px;padding:8px;color:var(--fg)}
.act input[type=range]{width:100%;margin:8px 0;accent-color:var(--amber)}.act input[type=number]{font-size:17px;font-weight:800}
.bf{background:linear-gradient(#e8483f,#b32720)}.bc{background:linear-gradient(#36b96c,#228a4d)}.br{background:linear-gradient(#f2b92b,#d08f0b)!important;color:#1b1300!important}
@media(prefers-reduced-motion:reduce){.cd.new,.st.t .av,.tb{animation:none}}
</style></head><body>
<h1>♠ Pokerkvällen</h1>
<div id="login">
<div class="row"><input id="nm" placeholder="Ditt namn" maxlength="14"><input id="cd" placeholder="Bordskod, t.ex. fredag" maxlength="20"></div>
<div class="row"><input id="pw" placeholder="Lösenord (valfritt – sätts om du skapar bord)" maxlength="40"></div>
<div class="row"><button class="p" onclick="go(0)">Gå med i bord</button></div>
<details style="margin:12px 0"><summary class="mut">Skapa nytt bord (inställningar)</summary>
<div class="row"><label class="mut">Variant<select id="vr" onchange="if(this.value=='omaha5'||this.value=='donk'||this.value=='sviten'||this.value=='o8')$('#lm').checked=true"><option value="holdem">Texas Hold'em</option><option value="omaha">Omaha (4 kort)</option><option value="omaha5">PLO5 (Omaha, 5 kort)</option><option value="donk">DonkEm (PLO, 2+2+1+superriver)</option><option value="pine">Pineapple (kasta 1 före floppen)</option><option value="crazy">Crazy Pineapple (kasta 1 efter floppen)</option><option value="lazy">Lazy Pineapple (kasta 1 efter turn)</option><option value="sviten">Sviten Special (5 kort, byte, delad pott)</option><option value="o8">Omaha Hi-Lo (8 eller bättre)</option><option value="stud">Seven Card Stud (fixed limit)</option><option value="razz">Razz (A–5 lowball, fixed limit)</option></select></label><label class="mut" style="flex-direction:row;align-items:center;gap:8px;flex:none"><input id="lm" type="checkbox" style="flex:none"> Pot limit</label></div>
<div class="row"><label class="mut">Small blind<input id="sb" type="number" inputmode="numeric" value="5"></label><label class="mut">Big blind<input id="bb" type="number" inputmode="numeric" value="10"></label></div>
<div class="row"><label class="mut">Minsta buy-in<input id="mn" type="number" inputmode="numeric" value="200"></label><label class="mut">Största buy-in<input id="mx" type="number" inputmode="numeric" value="1000"></label></div>
<div class="row"><label class="mut">Bomb pot-ante (0 = av)<input id="bm" type="number" inputmode="numeric" value="0"></label><label class="mut">Automatiskt var N:e giv (0 = bara på begäran)<input id="bn" type="number" inputmode="numeric" value="0"></label></div>
<div class="row"><button onclick="go(1)">Skapa bord</button></div></details>
<div id="er" class="mut"></div></div>
<div id="app" hidden></div><div id="note" class="msg" hidden></div>
<script>
const $=s=>document.querySelector(s),RK="23456789TJQKA",SU="♠♥♦♣",cr=c=>2+c%13,cs=c=>Math.floor(c/13);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let ws,S=null,name,code,tok,mk=null;
const cd=(c,x,st)=>c==null?`<span class="cd back${x?' '+x:''}"${st?` style="${st}"`:''}></span>`:`<span class="cd s${cs(c)}${x?' '+x:''}"${st?` style="${st}"`:''}><b>${RK[cr(c)-2]=='T'?'10':RK[cr(c)-2]}</b><i>${SU[cs(c)]}</i><u>${SU[cs(c)]}</u></span>`;
const card=c=>cd(c);
const sd=(t,o)=>ws&&ws.readyState==1&&ws.send(JSON.stringify(Object.assign({t},o)));
function go(create){keepAwake();name=$('#nm').value.trim().slice(0,14);code=$('#cd').value.trim().toLowerCase();if(!name||!code)return;
 try{localStorage.setItem('pk_nm',name);tok=localStorage.getItem('pk_tok');if(!tok){tok=crypto.randomUUID();localStorage.setItem('pk_tok',tok)}}catch(e){tok=tok||String(Math.random()).slice(2)+Date.now()}
 mk=create?{v:$('#vr').value,sb:$('#sb').value,bb:$('#bb').value,min:$('#mn').value,max:$('#mx').value,lim:$('#lm').checked,bomb:$('#bm').value,bn:$('#bn').value,pw:$('#pw').value}:null;S=null;conn()}
function conn(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>sd('join',{code,token:tok,create:mk,pw:$('#pw').value});
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.closed){S=null;$('#app').hidden=true;$('#login').hidden=false;$('#er').textContent=m.closed;return}
  if(m.err){$('#er').textContent=m.err;return}
  if(m.note){const n=$('#note');n.textContent=m.note;n.hidden=false;setTimeout(()=>n.hidden=true,8000)}
  if(m.s){cfg.off=false;S=m.s;S.recv=Date.now();turnAlert();$('#login').hidden=true;$('#app').hidden=false;const nw=S.phase=='show'&&S.wins&&S.wins.length&&cfg.an!=S.hn;if(nw){cfg.an=S.hn;cfg.at=Date.now();setTimeout(render,1600);setTimeout(render,2900)}render();if(nw)fx()}};
 ws.onclose=()=>{if(S){cfg.off=true;render();setTimeout(conn,1500)}}}
const RN=['','','tvåa','trea','fyra','femma','sexa','sjua','åtta','nia','tia','knekt','dam','kung','ess'],RP=['','','tvåor','treor','fyror','femmor','sexor','sjuor','åttor','nior','tior','knektar','damer','kungar','ess'];
function ev5(c){const r=c.map(cr).sort((a,b)=>b-a),fl=c.every(x=>cs(x)==cs(c[0])),n={};r.forEach(x=>n[x]=(n[x]||0)+1);
 const g=Object.keys(n).map(Number).sort((a,b)=>n[b]-n[a]||b-a);let st=0;
 if(g.length==5){if(r[0]-r[4]==4)st=r[0];else if(r[0]==14&&r[1]==5)st=5}
 const k=n[g[0]],cat=st&&fl?8:k==4?7:k==3&&n[g[1]]==2?6:fl?5:st?4:k==3?3:k==2&&n[g[1]]==2?2:k==2?1:0;
 return cat*1e6+(st?[st]:g).reduce((a,x)=>a*15+x,0)}
function comb(a,k){const o=[];(function f(i,p){if(p.length==k){o.push(p);return}for(let j=i;j<a.length;j++)f(j+1,[...p,a[j]])})(0,[]);return o}
function best(h,b,v){let m=0;const t=x=>{const s=ev5(x);if(s>m)m=s};
 if(['omaha','omaha5','donk','sviten','o8'].includes(v))comb(h,2).forEach(a=>comb(b,3).forEach(c=>t(a.concat(c))));else comb(h.concat(b),5).forEach(t);return m}
function nm(sc){const cat=Math.floor(sc/1e6);let e=sc%1e6;const g=[];while(e>0){g.unshift(e%15);e=Math.floor(e/15)}
 const s=r=>RN[r],p=r=>RP[r];
 return[`Högt kort, ${s(g[0])}`,`Par i ${p(g[0])}`,`Två par, ${p(g[0])} och ${p(g[1])}`,`Triss i ${p(g[0])}`,`Stege till ${s(g[0])}`,`Färg, ${s(g[0])} högt`,`Kåk, ${p(g[0])} över ${p(g[1])}`,`Fyrtal i ${p(g[0])}`,g[0]==14?'Royal flush':`Straight flush till ${s(g[0])}`][cat]}
const lr=x=>{const r=cr(x);return r==14?1:r},rn=x=>({1:'A',11:'J',12:'Q',13:'K'}[x]||x);
function evP(k){if(k.length==5)return ev5(k);const n={};k.map(cr).forEach(x=>n[x]=(n[x]||0)+1);const g=Object.keys(n).map(Number).sort((a,b)=>n[b]-n[a]||b-a),m=n[g[0]];
 return(m==4?7:m==3?3:m==2&&n[g[1]]==2?2:m==2?1:0)*1e6+g.reduce((a,x)=>a*15+x,0)}
function bestHi(k){if(k.length<5)return evP(k);let m=0;comb(k,5).forEach(x=>{const v=ev5(x);if(v>m)m=v});return m}
function lowSc(r){return(r.length-new Set(r).size)*1e8+r.slice().sort((a,b)=>b-a).reduce((a,x)=>a*14+x,0)}
function bestLowC(k){const r=k.map(lr);if(r.length<=5)return r.sort((a,b)=>b-a);let b=null,bs=null;comb(r,5).forEach(x=>{const v=lowSc(x);if(bs==null||v<bs){bs=v;b=x}});return b.slice().sort((a,c)=>c-a)}
function lowO8(h,b){let m=null;comb(h,2).forEach(a=>comb(b,3).forEach(c=>{const l=a.concat(c).map(lr);if(Math.max(...l)>8||new Set(l).size<5)return;const v=l.sort((x,y)=>y-x).reduce((s,x)=>s*9+x,0);if(m==null||v<m)m=v}));return m}
function lowTxt(v){const o=[];while(v>0){o.unshift(v%9);v=Math.floor(v/9)}return o.map(rn).join('-')}
function desc(h,b,v){if(!h)return'';
 if(v=='stud'||v=='razz'){const k=h.filter(x=>x!=null).concat(b||[]);if(!k.length)return'';return v=='razz'?'Låg '+bestLowC(k).map(rn).join('-'):nm(bestHi(k))}
 const o=b.length>=3?nm(best(h,b,v)):'';
 if(v=='sviten')return(o?'Omaha: '+o+' · ':'')+'Draw: '+nm(ev5(h));
 if(v=='o8'&&b.length>=3){const l=lowO8(h,b);return o+' · '+(l==null?'ingen låg':'Låg '+lowTxt(l))}
 return o}
const cfg={};let P={deck:'four',back:'blue',qb:'50,75,100',qmin:true,hs:true};try{Object.assign(P,JSON.parse(localStorage.getItem('pk_prefs')||'{}'))}catch(e){}
function ap(){document.body.dataset.deck=P.deck;document.body.dataset.back=P.back}ap();
function qbs(){return String(P.qb||'').split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean).slice(0,6).map(x=>{let m;
 if(m=x.match(/^(\d+(?:[.,]\d+)?)%?$/))return{l:m[1]+' %',f:parseFloat(m[1].replace(',','.'))/100};
 if(m=x.match(/^(\d+(?:[.,]\d+)?)(?:bb|x)$/))return{l:m[1]+' bb',b:parseFloat(m[1].replace(',','.'))};return null}).filter(Boolean)}
function sp(k,v){if(k=='dk')P.deck=v;if(k=='bk')P.back=v;if(k=='qm')P.qmin=v;if(k=='hs')P.hs=v;if(k=='qb'){P.qb=v;if(!qbs().length)P.qb='50,75,100'}
 try{localStorage.setItem('pk_prefs',JSON.stringify(P))}catch(e){}ap();render()}
